<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SahihAgent - Go AI Assistant</title>
    <link rel="stylesheet" href="agent.css">
</head>
<body>

    <header>
        <div class="controls">
            <button class="icon-button" onclick="toggleTheme()" id="theme-btn" title="Toggle Theme">
                <svg id="theme-icon" viewBox="0 0 24 24">
                    <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>
                </svg>
            </button>
        </div>
        <h1>SahihAgent</h1>
        <p>Sunni AI Assistant Powered by Go</p>
    </header>

    <main>
        <div class="chat-card">
            <div class="chat-box" id="chat-box">
                <div class="msg agent">
                    <span class="msg-sender">SahihAgent</span>
                    Assalamu Alaykum! I am SahihAgent, Ask me about Islamic concepts, Hadith verification tips, or general questions.
                </div>
            </div>

            <div class="input-row">
                <input type="text" id="user-input" placeholder="Ask SahihAgent anything..." onkeypress="if(event.key==='Enter') sendMessage()" />
                <button class="send-btn" id="send-btn" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 SahihFinder - Shahadah Studios Elite</p>
    </footer>

    <script src="agent.js"></script>
</body>
</html>
