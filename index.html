<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="icon" type="image/png" href="/favicon1.png?v=6">
    <title>SahihFinder - Verify the Truth</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#054432">
    <style>
        :root {
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --primary-color: #054432;
            --accent-color: #c28100;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        [data-theme="dark"] {
            --bg-color: #0f172a;
            --text-color: #f1f5f9;
            --card-bg: #1e293b;
            --border-color: #334155;
            --primary-color: #022c22;
            --accent-color: #f6ad55;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -1px rgba(0, 0, 0, 0.1);
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 60px 20px;
            text-align: center;
            position: relative;
            border-bottom: 1px solid var(--border-color);
        }
        header h1 {
            margin: 0;
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }
        header p {
            margin: 12px 0 0 0;
            color: #f6ad55;
            font-size: 1.2rem;
            font-weight: 400;
        }
        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
        }
        .icon-button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .icon-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .icon-button svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
        #pwa-btn {
            display: none;
        }
        main {
            flex: 1;
            max-width: 800px;
            width: 100%;
            margin: 60px auto;
            padding: 0 20px;
            box-sizing: border-box;
        }
        .hero-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            box-shadow: var(--shadow);
        }
        .hero-card h2 {
            color: var(--accent-color);
            margin-top: 0;
            font-size: 2rem;
            font-weight: 600;
        }
        .hero-card p {
            font-size: 1.15rem;
            line-height: 1.75;
            color: var(--text-color);
            opacity: 0.9;
            margin-bottom: 35px;
        }
        .action-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 32px;
            background-color: var(--primary-color);
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            border-radius: 6px;
            border: 1px solid var(--primary-color);
            transition: background-color 0.2s, color 0.2s, transform 0.1s;
            box-shadow: var(--shadow);
        }
        .action-button:hover {
            background-color: transparent;
            color: var(--text-color);
        }
        .action-button:active {
            transform: scale(0.98);
        }
        footer {
            padding: 30px 20px;
            font-size: 0.9rem;
            color: #64748b;
            border-top: 1px solid var(--border-color);
            text-align: center;
            background-color: var(--card-bg);
        }
    </style>
</head>
<body>

    <header>
        <div class="controls">
            <button class="icon-button" id="pwa-btn" title="Install App">
                <svg viewBox="0 0 24 24">
                    <path d="M5 20h14v-2H5v2zm7-18L5.33 11h4V16h5.34v-5h4L12 2z"/>
                </svg>
            </button>
            <button class="icon-button" onclick="toggleTheme()" id="theme-btn" title="Toggle Theme">
                <svg id="theme-icon" viewBox="0 0 24 24">
                    <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>
                </svg>
            </button>
        </div>
        <h1>SahihFinder</h1>
        <p>A website for Muslims to verify the truth from the internet</p>
    </header>

    <main>
        <div class="hero-card">
            <h2>Welcome to SahihFinder</h2>
            <p>A dedicated platform built to help clarify and verify information online in accordance with Islamic values.</p>
            <a href="Wiki.html" class="action-button">Explore The WiKi</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 SahihFinder - Shahadah Studios Elite</p>
    </footer>

    <script>
        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('theme-icon');
            
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
                icon.innerHTML = '<path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>';
            } else {
                body.setAttribute('data-theme', 'dark');
                icon.innerHTML = '<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.42l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.42L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.42l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.42l-1.06-1.06zm1.06-12.37c-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.42s1.03.39 1.41 0l1.06-1.06c.39-.38.39-1.02 0-1.42zM5.99 16.95l-1.06 1.06c-.39.39-.39 1.03 0 1.42s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.42z"/>';
            }
        }

        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('pwa-btn').style.display = 'flex';
        });

        document.getElementById('pwa-btn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('pwa-btn').style.display = 'none';
                }
                deferredPrompt = null;
            }
        });

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }
    </script>
</body>
</html>
