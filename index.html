<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SahihFinder - Verify the Truth</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7f9f6;
            color: #2d3748;
            text-align: center;
        }
        header {
            background-color: #054432;
            color: #ffffff;
            padding: 40px 20px;
        }
        header h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 600;
        }
        header p {
            margin: 10px 0 0 0;
            color: #f6ad55;
            font-size: 1.1rem;
        }
        main {
            max-width: 650px;
            margin: 50px auto;
            padding: 30px 20px;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
        }
        main h2 {
            color: #054432;
            margin-top: 0;
            font-size: 1.6rem;
        }
        main p {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #4a5568;
            margin-bottom: 30px;
        }
        .wiki-button {
            display: inline-block;
            padding: 12px 32px;
            background-color: #054432;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            border-radius: 4px;
            border: 1px solid #054432;
        }
        .wiki-button:hover {
            background-color: #ffffff;
            color: #054432;
        }
        footer {
            margin-top: 60px;
            padding: 20px 0;
            font-size: 0.85rem;
            color: #718096;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>

    <div id="app"></div>

    <script type="module">
        import { transform } from 'https://esm.sh';
        
        async function loadTS() {
            const response = await fetch('./index.ts');
            const tsCode = await response.text();
            const result = await transform(tsCode, { loader: 'ts' });
            
            const script = document.createElement('script');
            script.type = 'module';
            script.textContent = result.code;
            document.body.appendChild(script);
        }
        
        loadTS().catch(err => console.error("Error loading index.ts:", err));
    </script>
</body>
</html>
