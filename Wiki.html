<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SahihFinder | Wiki</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7f9f6;
            color: #2d3748;
            text-align: center;
        }
        header {
            background-color: #054432;
            color: #ffffff;
            padding: 30px 15px;
        }
        header h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 600;
        }
        header p {
            margin: 8px 0 0 0;
            color: #f6ad55;
            font-size: 1rem;
        }
        nav {
            background-color: #032f22;
            padding: 12px 0;
        }
        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
        }
        nav a:hover {
            color: #f6ad55;
        }
        main {
            max-width: 650px;
            margin: 20px auto;
            padding: 20px 15px;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            text-align: center;
        }
        .tabs-container {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            justify-content: center;
        }
        .tab-button {
            flex: 1;
            max-width: 150px;
            padding: 12px 10px;
            background-color: #f1f5f9;
            border: 1px solid #cbd5e1;
            color: #475569;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            box-sizing: border-box;
        }
        .tab-button:hover {
            background-color: #e2e8f0;
        }
        .tab-button.active {
            background-color: #054432;
            color: #ffffff;
            border-color: #054432;
        }
        .wiki-content-box {
            padding: 35px 15px;
            background-color: #fafafa;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            margin-bottom: 25px;
        }
        .wiki-content-box h2 {
            margin-top: 0;
            color: #054432;
            font-size: 1.4rem;
            margin-bottom: 15px;
        }
        .wiki-content-box p {
            line-height: 1.6;
            color: #334155;
            font-size: 1.1rem;
            font-weight: 500;
            margin: 0;
        }
        .back-button {
            display: inline-block;
            padding: 12px 24px;
            background-color: transparent;
            color: #054432;
            text-decoration: none;
            font-weight: 600;
            border-radius: 4px;
            border: 1px solid #054432;
            width: 80%;
            max-width: 200px;
            box-sizing: border-box;
        }
        .back-button:hover {
            background-color: #054432;
            color: #ffffff;
        }
        footer {
            margin-top: 40px;
            padding: 20px 0;
            font-size: 0.85rem;
            color: #718096;
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>
<body>

    <header>
        <h1>SahihFinder Wiki</h1>
        <p>A website for Muslims to verify the truth from the internet</p>

    <nav>
        <a href="index.html">Home</a>
    </nav>

    <main>
        <div class="tabs-container">
            <button class="tab-button active" onclick="switchTab('all')">All</button>
            <button class="tab-button" onclick="switchTab('madhab')">Madhab</button>
        </div>
<div class="wiki-content-box">
            <h2 id="section-title">General</h2>
            <div id="section-content">
                <p>We're Researching to get the best for you! Please check back SOON!</p>
            </div>
        </div>
        

        <div>
            <a href="index.html" class="back-button">Return Home</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 SahihFinder - Shahadah Studios Elite</p>
    </footer>

    <script>
        const titles = {
            all: "General",
            madhab: "Madhab Section"
        };

        

                const contents = {
           // here to write HTML we may need `` to run it.
                    all: "We're Researching to get the get the best for you! Please check back SOON!",
            madhab: "We're researching the best on the Madhab topic for you! Please check back Soon!"
        };

        function switchTab(key) {
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });

            if (event && event.currentTarget) {
                event.currentTarget.classList.add('active');
            }

            const titleElem = document.getElementById('section-title');
            if (titleElem && titles[key]) {
                titleElem.textContent = titles[key];
            }

            const contentElem = document.getElementById('section-content');
            if (contentElem && contents[key]) {
                contentElem.innerHTML = contents[key];
            }
        }
    </script>
</body>
</html>
