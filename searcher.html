<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SahihFinder - Hadith Searcher</title>
    <link rel="stylesheet" href="search.css">
<link rel="icon" type="image/png" href="/favicon1.png?v=6">
</head>
<body>

    <header>
        <div class="controls">
            <button class="icon-button" onclick="toggleTheme()" id="theme-btn" title="Toggle Theme">
                <svg id="theme-icon" viewBox="0 0 24 24">
                    <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>
                </svg>
            </button>
        </div>
        <h1>SahihFinder</h1>
    </header>

    <nav>
        <a href="/">Home</a>
    </nav>

    <main>
        <div class="search-card">
            <h2>Hadith searching tool</h2>
            <p class="desc">Enter keywords or a phrase to search authentic collections with direct Sunnah.com verification links.</p>
            
            <div class="input-group">
                <input type="text" id="query-input" placeholder="Example: actions are by intentions" onkeypress="if(event.key==='Enter') searchHadith()" />
                <button class="search-btn" onclick="searchHadith()">Search</button>
            </div>

            <div class="results-area" id="results-container"></div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 SahihFinder - Shahadah Studios Elite</p>
    </footer>

    <script src="searcher.js"></script>
</body>
</html>
