    <style>
        :root {
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --card-bg: #ffffff;
            --box-bg: #fafafa;
            --border-color: #e2e8f0;
            --primary-color: #054432;
            --accent-color: #c28100;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
        [data-theme="dark"] {
            --bg-color: #0f172a;
            --text-color: #f1f5f9;
            --card-bg: #1e293b;
            --box-bg: #0f172a;
            --border-color: #334155;
            --primary-color: #022c22;
            --accent-color: #f6ad55;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -1px rgba(0, 0, 0, 0.1);
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            text-align: center;
        }
        header {
            background-color: var(--primary-color);
            color: #ffffff;
            padding: 40px 20px;
            position: relative;
            border-bottom: 1px solid var(--border-color);
        }
        header h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 700;
        }
        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
        }
        .icon-button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-button svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
        nav {
            background-color: var(--primary-color);
            padding: 12px 0;
            border-top: 1px solid var(--border-color);
        }
        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
        }
        main {
            flex: 1;
            max-width: 650px;
            width: 100%;
            margin: 40px auto;
            padding: 0 20px;
            box-sizing: border-box;
        }
        .checker-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 35px 25px;
            box-shadow: var(--shadow);
        }
        .checker-card h2 {
            color: var(--accent-color);
            margin-top: 0;
            font-size: 1.6rem;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--box-bg);
            color: var(--text-color);
            font-size: 1rem;
            box-sizing: border-box;
            resize: none;
            outline: none;
        }
        button.check-btn {
            background-color: var(--primary-color);
            color: #ffffff;
            border: 1px solid var(--primary-color);
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
        }
        button.check-btn:hover {
            opacity: 0.9;
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: var(--box-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            text-align: left;
            display: none;
        }
        .result-title {
            font-weight: 700;
            margin-bottom: 8px;
        }
        footer {
            padding: 25px 20px;
            font-size: 0.9rem;
            color: #64748b;
            border-top: 1px solid var(--border-color);
            background-color: var(--card-bg);
        }
    </style>
</head>

    <header>
        <div class="controls">
            <button class="icon-button" onclick="toggleTheme()" id="theme-btn" title="Toggle Theme">
                <svg id="theme-icon" viewBox="0 0 24 24">
                    <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>
                </svg>
            </button>
        </div>
        <h1>SahihFinder</h1>
    </header>

    <nav>
        <a href="/">Home</a>
    </nav>

    <main>
        <div class="checker-card">
            <h2>Instant Islamic Text checker</h2>
            <p>Paste an Islamic claim, or narration text below to run a fast safety check.</p>
            <textarea id="text-input" placeholder="Enter text here..."></textarea>
            <button class="check-btn" onclick="runCheck()">Scan Text</button>
            
            <div class="result-box" id="result-container">
                <div class="result-title" id="result-status"></div>
                <p id="result-text" style="margin: 0;"></p>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 SahihFinder - Shahadah Studios Elite</p>
    </footer>

    <script>
        function toggleTheme() {
            const body = document.body;
            const icon = document.getElementById('theme-icon');
            if (body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
                icon.innerHTML = '<path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>';
            } else {
                body.setAttribute('data-theme', 'dark');
                icon.innerHTML = '<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.42l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.42L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.42l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.42l-1.06-1.06zm1.06-12.37c-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.42s1.03.39 1.41 0l1.06-1.06c.39-.38.39-1.02 0-1.42zM5.99 16.95l-1.06 1.06c-.39.39-.39 1.03 0 1.42s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.42z"/>';
            }
        }

        async function runCheck() {
            const text = document.getElementById('text-input').value.trim();
            const container = document.getElementById('result-container');
            const statusElem = document.getElementById('result-status');
            const textElem = document.getElementById('result-text');

            if (!text) return;

            try {
                const response = await fetch('/api/check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                const data = await response.json();
                
                statusElem.textContent = "Status: " + data.status;
                statusElem.style.color = data.status === "Flagged" ? "#ef4444" : "#10b981";
                textElem.textContent = data.message;
                container.style.display = 'block';
            } catch (err) {
                statusElem.textContent = "Error";
                statusElem.style.color = "#ef4444";
                textElem.textContent = "Could not connect to Go backend.";
                container.style.display = 'block';
            }
        }
    </script>
